name: mp-dwh

# Порты сдвинуты (1xxxx), чтобы не конфликтовать с другими локальными стеками.
services:
  # ---------- Источник: база организаторов кейса (raw Olist, как пришло) ----------
  # Init-скрипты — копия scripts/init из репозитория кейса; логин hack/hack — как у организаторов.
  source:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hack
      POSTGRES_PASSWORD: hack
      POSTGRES_DB: marketplace
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - source-data:/var/lib/postgresql/data
      - ./source/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U hack -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ---------- DWH: Postgres (raw -> ods (Data Vault) -> dds (звезда) -> mart) ----------
  dwh:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dwh
      POSTGRES_PASSWORD: ${DWH_PASSWORD}
      POSTGRES_DB: dwh
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - dwh-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U dwh -d dwh"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Схемы и роли DWH. Идемпотентно, можно перезапускать.
  dwh-init:
    image: postgres:16-alpine
    environment:
      PGHOST: dwh
      PGPORT: "5432"
      PGUSER: dwh
      PGPASSWORD: ${DWH_PASSWORD}
      PGDATABASE: dwh
    command: >-
      psql -v ON_ERROR_STOP=1
      -v ch_reader_password=${CH_READER_PASSWORD}
      -v analyst_password=${DWH_ANALYST_PASSWORD}
      -f /dwh/init.sql
    volumes:
      - ./dwh:/dwh:ro
    depends_on:
      dwh: { condition: service_healthy }

  # ---------- Витрины ----------
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.31.2
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    environment:
      CLICKHOUSE_DB: mp
      CLICKHOUSE_USER: etl   # имя зашито в infra/clickhouse/users.d
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CH_READER_PASSWORD: ${CH_READER_PASSWORD}     # для named collection -> DWH
      CLICKHOUSE_BI_PASSWORD: ${CLICKHOUSE_BI_PASSWORD}
    ports:
      - "127.0.0.1:18123:8123"
      - "127.0.0.1:19000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infra/clickhouse/config.d/named_collections.xml:/etc/clickhouse-server/config.d/named_collections.xml:ro
      - ./infra/clickhouse/users.d/etl_named_collections.xml:/etc/clickhouse-server/users.d/zz_etl_named_collections.xml:ro
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'clickhouse-client --user "$${CLICKHOUSE_USER}" --password "$${CLICKHOUSE_PASSWORD}" --query "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # ---------- Оркестрация: Airflow 3 standalone + dbt в отдельном venv ----------
  airflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  airflow:
    build:
      context: ./infra/airflow
      additional_contexts:
        dbt: ./dbt
    image: mp-airflow:3.3.0
    command: standalone
    user: "${AIRFLOW_UID:-50000}:0"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      # Локальный стенд хакатона: без логина, все — админы. Наружу порт не торчит (127.0.0.1).
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_JWT_SECRET}
      PYTHONPATH: /opt/project
      # Подключения для пайплайна
      SOURCE_DSN: host=source port=5432 dbname=marketplace user=hack password=hack
      DWH_DSN: host=dwh port=5432 dbname=dwh user=dwh password=${DWH_PASSWORD}
      DWH_PASSWORD: ${DWH_PASSWORD}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: etl   # имя зашито в infra/clickhouse/users.d
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      DBT_PROFILES_DIR: /opt/project/dbt
    ports:
      - "127.0.0.1:18090:8080"
    volumes:
      - .:/opt/project
      - airflow-logs:/opt/airflow/logs
    depends_on:
      airflow-db: { condition: service_healthy }
      source: { condition: service_healthy }
      dwh: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8080/api/v2/monitor/health]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

volumes:
  source-data:
  dwh-data:
  clickhouse-data:
  airflow-db-data:
  airflow-logs:
