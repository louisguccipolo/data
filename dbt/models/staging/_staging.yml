version: 2

models:
  - name: stg_users
    columns:
      - name: user_id
        data_tests: [unique, not_null]
      - name: email_hash
        data_tests: [unique, not_null]
  - name: stg_sellers
    columns:
      - name: seller_id
        data_tests: [unique, not_null]
  - name: stg_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: current_price
        data_tests:
          - not_null
  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: [created, paid, shipped, delivered, cancelled, returned]
  - name: stg_order_items
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
